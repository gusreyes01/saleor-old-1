name: Legacy CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    container:
      image: python:3.7-buster
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned linter
        run: python -m pip install --disable-pip-version-check flake8==3.7.8
      - name: Check Python style
        run: flake8 saleor tests
      - name: Compile Python sources
        run: python -m compileall -q saleor tests

  frontend-build:
    runs-on: ubuntu-latest
    container:
      image: node:10-buster
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build-assets
